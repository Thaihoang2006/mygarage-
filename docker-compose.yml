services:
  db:
    image: mysql:8.0
    container_name: mygarage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mygarage_root_pass
      MYSQL_DATABASE: mygarage_db
      MYSQL_USER: mygarage_user
      MYSQL_PASSWORD: mygarage_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmygarage_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mygarage-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mygarage-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: mygarage-compose-secret-key
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: mygarage_user
      DB_PASSWORD: mygarage_pass
      DB_NAME: mygarage_db
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - mygarage-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mygarage-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mygarage-net

volumes:
  mysql_data:
  uploads_data:

networks:
  mygarage-net:
    driver: bridge
