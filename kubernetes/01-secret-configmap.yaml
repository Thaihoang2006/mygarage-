apiVersion: v1
kind: ConfigMap
metadata:
  name: mygarage-config
  namespace: mygarage
data:
  FLASK_ENV: "production"
  DB_HOST: "db"
  DB_PORT: "3306"
  DB_NAME: "mygarage_db"
  DB_USER: "mygarage_user"
  UPLOAD_FOLDER: "/app/uploads"
---
apiVersion: v1
kind: Secret
metadata:
  name: mygarage-secret
  namespace: mygarage
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "mygarage_root_pass"
  MYSQL_PASSWORD: "mygarage_pass"
  SECRET_KEY: "mygarage-production-super-secret-key-cka2026"
